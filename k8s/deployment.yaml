apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
  labels:
    app: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
      - name: calculator
        image: dimpulratakonda/calculator:99dfa604ef05a80c900f3dd04464ed43bc6af7ec
        ports:
        - containerPort: 5000
        imagePullPolicy: Always